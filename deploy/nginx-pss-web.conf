# Sample nginx site config for the PSS Companion website.
#
#   sudo apt install nginx
#   sudo cp deploy/nginx-pss-web.conf /etc/nginx/sites-available/pss-web
#   sudo ln -s /etc/nginx/sites-available/pss-web /etc/nginx/sites-enabled/
#   # edit server_name below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   # for HTTPS, run certbot:  sudo certbot --nginx -d your-domain.example
server {
    listen 80;
    server_name your-domain.example;   # <-- change me

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets can be served by nginx directly (optional micro-optim):
    # location /static/ {
    #     alias /home/ubuntu/BOTTESTE/web/static/;
    #     expires 7d;
    # }
}
