<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PSS Companion{% endblock %}</title>
  <meta name="description" content="Pixel Starships companion: crew stats, prestige recipes, item prices, daily deals, fleet rankings.">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">🛸 <strong>PSS Companion</strong></a>
    <nav>
      <a href="/crew">Crew</a>
      <a href="/items">Items</a>
      <a href="/fleets">Fleets</a>
      <a href="/players">Players</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Unofficial fan site. Not affiliated with Savy Soda. Data from the public
       Pixel Starships API, refreshed hourly (live data every 5 min).</p>
  </footer>
</body>
</html>
